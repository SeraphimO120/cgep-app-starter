# .github/workflows/grc-gate.yml
#
# GRC gate for the Acme Health Patient Intake API.
#   Pull request   -> plan role (read-only, no PHI decrypt): plan, policy gate, sign, vault.
#   Push to main   -> apply role: plan, policy gate, apply if the gate passes,
#                     live control tests, sign, vault.
#   Nightly / manual -> plan role: drift check (plan must show no changes),
#                     live control tests, sign, vault.
# Evidence is signed and stored even when a check fails; the job fails last.

name: grc-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nightly drift + control tests, 06:17 UTC
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: grc-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform
  TF_VERSION: 1.16.5
  CONFTEST_VERSION: 0.71.0
  COSIGN_VERSION: v3.1.3
  # Retry transient AWS API failures (throttling, 5xx) during upload and plan.
  AWS_RETRY_MODE: adaptive
  AWS_MAX_ATTEMPTS: "10"

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Explicit bash runs every step with -eo pipefail, so a failing
        # terraform or conftest command cannot be masked by "| tee".
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ github.event_name == 'push' && vars.AWS_APPLY_ROLE_ARN || vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Conftest and Cosign (versions match local tooling)
        run: |
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          sudo curl -fsSL -o /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo chmod +x /usr/local/bin/cosign
          conftest --version
          cosign version

      - name: Record run metadata
        # Built from runner-provided environment variables, never ${{ }} interpolation
        # inside the script, and serialized with jq so no value can break the JSON.
        run: |
          mkdir -p evidence
          jq -n \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg event "$GITHUB_EVENT_NAME" \
            --arg ref "$GITHUB_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg actor "$GITHUB_ACTOR" \
            --arg started_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg terraform "$TF_VERSION" \
            --arg conftest "$CONFTEST_VERSION" \
            --arg cosign "$COSIGN_VERSION" \
            '$ARGS.named' > evidence/run-metadata.json
          cat evidence/run-metadata.json

      - name: Policy unit tests
        run: conftest verify --policy policies | tee evidence/policy-tests.txt

      - name: Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan | tee ../evidence/plan.txt
          rc=${PIPESTATUS[0]}
          set -e
          # 0 = no changes, 2 = changes present, anything else = error
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then exit "$rc"; fi
          if [ "$rc" -eq 2 ]; then echo "changes=true" >> "$GITHUB_OUTPUT"; else echo "changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -json tfplan > ../evidence/plan.json

      - name: Policy check
        id: gate
        run: |
          conftest test --policy policies --all-namespaces --output=json evidence/plan.json \
            > evidence/conftest-results.json || true
          FAILS=$(python3 -c 'import json; d=json.load(open("evidence/conftest-results.json")); print(sum(len(r.get("failures") or []) for r in d))')
          WARNS=$(python3 -c 'import json; d=json.load(open("evidence/conftest-results.json")); print(sum(len(r.get("warnings") or []) for r in d))')
          echo "failures=${FAILS}" >> "$GITHUB_OUTPUT"
          echo "warnings=${WARNS}" >> "$GITHUB_OUTPUT"
          echo "Policy gate: ${FAILS} failure(s), ${WARNS} warning(s)"
          conftest test --policy policies --all-namespaces evidence/plan.json || true

      - name: Apply (on merge to main, gate must pass)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gate.outputs.failures == '0'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -input=false -no-color tfplan | tee ../evidence/apply.txt

      - name: Drift check (nightly and manual runs)
        id: drift
        if: always() && steps.plan.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          CHANGES: ${{ steps.plan.outputs.changes }}
        run: |
          if [ "$CHANGES" = "true" ]; then
            echo "DRIFT: the live infrastructure no longer matches main. See plan.txt in this bundle." | tee evidence/drift.txt
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "No drift: live infrastructure matches main." | tee evidence/drift.txt
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Live control tests
        id: controls
        if: always() && steps.plan.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          set +e
          scripts/control-tests.sh evidence/control-tests.json
          set -e
          echo "failures=$(jq -r '.failures // "error"' evidence/control-tests.json 2>/dev/null || echo error)" >> "$GITHUB_OUTPUT"

      - name: Sign
        id: sign
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          tar -czf "${BUNDLE}" -C evidence .
          sha256sum "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"
          # Keyless signing: the GitHub OIDC identity of this workflow run is the signer.
          cosign sign-blob --yes --bundle "${BUNDLE}.sigstore.json" "${BUNDLE}"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Upload
        id: upload
        if: always() && steps.sign.outcome == 'success'
        env:
          VAULT: ${{ vars.EVIDENCE_VAULT }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          BUNDLE: ${{ steps.sign.outputs.bundle }}
        run: |
          set -euo pipefail
          PREFIX="runs/${RUN_ID}"
          aws s3 cp "${BUNDLE}"                "s3://${VAULT}/${PREFIX}/${BUNDLE}"
          aws s3 cp "${BUNDLE}.sha256"         "s3://${VAULT}/${PREFIX}/${BUNDLE}.sha256"
          aws s3 cp "${BUNDLE}.sigstore.json"  "s3://${VAULT}/${PREFIX}/${BUNDLE}.sigstore.json"

          VERSION_ID=$(aws s3api head-object --bucket "${VAULT}" --key "${PREFIX}/${BUNDLE}" --query VersionId --output text)
          RETAIN=$(aws s3api head-object --bucket "${VAULT}" --key "${PREFIX}/${BUNDLE}" --query ObjectLockRetainUntilDate --output text)
          cat > receipt.json <<RECEIPT
          {
            "run_id": "${RUN_ID}",
            "commit": "${SHA}",
            "vault": "${VAULT}",
            "bundle_key": "${PREFIX}/${BUNDLE}",
            "version_id": "${VERSION_ID}",
            "retain_until": "${RETAIN}",
            "sha256": "$(cat "${BUNDLE}.sha256")"
          }
          RECEIPT
          aws s3 cp receipt.json "s3://${VAULT}/${PREFIX}/receipt.json"
          cat receipt.json

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grc-evidence-${{ github.run_id }}
          path: |
            evidence/
            evidence-${{ github.run_id }}-*
            receipt.json
          retention-days: 90

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## GRC gate run ${{ github.run_id }}

            - Policy gate: **${{ steps.gate.outputs.failures }} failure(s)**, ${{ steps.gate.outputs.warnings }} warning(s)
            - Sign: `${{ steps.sign.outcome }}`, Upload: `${{ steps.upload.outcome }}`
            - Evidence: `s3://${{ vars.EVIDENCE_VAULT }}/runs/${{ github.run_id }}/`

      - name: Enforce gate decision
        if: always()
        env:
          FAILS: ${{ steps.gate.outputs.failures }}
          CONTROL_FAILS: ${{ steps.controls.outputs.failures }}
          CONTROLS_RAN: ${{ steps.controls.outcome }}
          DRIFT: ${{ steps.drift.outputs.drift }}
        run: |
          status=0
          if [ -z "${FAILS}" ]; then
            echo "FAILED: the policy gate never ran. Check the earlier steps."; status=1
          elif [ "${FAILS}" != "0" ]; then
            echo "FAILED: ${FAILS} policy failure(s)."; status=1
          fi
          if [ "${CONTROLS_RAN}" = "success" ] && [ "${CONTROL_FAILS}" != "0" ]; then
            echo "FAILED: live control tests reported ${CONTROL_FAILS} failure(s)."; status=1
          fi
          if [ "${DRIFT}" = "true" ]; then
            echo "FAILED: drift detected between main and the live account."; status=1
          fi
          if [ "$status" -eq 0 ]; then echo "GRC gate PASSED."; else echo "Evidence for this run was signed and stored."; fi
          exit "$status"
